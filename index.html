<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Boti és Szonja nap</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #fdf6ec;
      color: #2b2118;
      -webkit-user-select: none;
      user-select: none;
    }
    header { padding: 20px 16px 8px; text-align: center; }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    #arena {
      position: relative;
      margin: 12px auto;
      width: calc(100% - 32px);
      max-width: 1000px;
      height: 62vh;
      min-height: 380px;
      background: repeating-linear-gradient(45deg, #fff7e6, #fff7e6 20px, #fff1d6 20px, #fff1d6 40px);
      border: 3px dashed #d9a35b;
      border-radius: 16px;
      overflow: hidden;
      touch-action: none;
    }
    .date {
      position: absolute;
      left: 0; top: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #fff;
      border: 2px solid #c47f2c;
      border-radius: 999px;
      font-size: 0.95rem;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
      will-change: transform;
    }
    .date .box {
      width: 20px; height: 20px;
      border: 2px solid #c47f2c;
      border-radius: 5px;
      display: grid; place-items: center;
      font-weight: bold; color: #fff;
      flex: none;
    }
    .date.checked { background: #e8f6e8; border-color: #3a8a3a; }
    .date.checked .box { background: #3a8a3a; border-color: #3a8a3a; }
    .date.checked .box::after { content: "✓"; font-size: 14px; line-height: 1; }
    .taunt {
      position: absolute;
      pointer-events: none;
      font-weight: bold;
      color: #c0392b;
      font-size: 1.1rem;
      white-space: nowrap;
      animation: floatUp 1.6s ease-out forwards;
      z-index: 10;
    }
    @keyframes floatUp {
      from { opacity: 1; transform: translate(-50%, 0) scale(1); }
      to   { opacity: 0; transform: translate(-50%, -50px) scale(1.3); }
    }
    #panel {
      max-width: 1000px;
      margin: 0 auto 40px;
      padding: 0 16px;
    }
    #chosen { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; }
    #chosen li {
      background: #3a8a3a; color: #fff;
      padding: 6px 10px; border-radius: 999px; font-size: 0.9rem;
    }
    #chosen li button {
      background: none; border: none; color: #fff; cursor: pointer;
      font-size: 1rem; margin-left: 4px; padding: 0;
    }
    #chosen .empty { background: none; color: #8a7764; padding: 6px 0; }
    #done {
      margin-top: 12px;
      padding: 14px 32px; font-size: 1.2rem; font-weight: 700;
      border: none; border-radius: 12px; cursor: pointer;
      background: #c47f2c; color: #fff;
    }
    #status { margin-top: 10px; min-height: 1.4em; color: #c0392b; font-weight: 600; }
    #result {
      display: none;
      position: fixed; inset: 0;
      background: rgba(43, 33, 24, .75);
      z-index: 100;
      overflow: auto;
      padding: 24px 16px;
      text-align: center;
      color: #fff;
    }
    #result.open { display: block; }
    #result h2 { margin: 0 0 16px; font-size: 1.5rem; }
    #result img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
      -webkit-user-select: auto; user-select: auto;
      -webkit-touch-callout: default;
    }
    #result .actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    #result a, #result button {
      padding: 12px 18px; font-size: 1rem; font-weight: 600;
      border-radius: 10px; cursor: pointer; text-decoration: none;
    }
    #result a { background: #c47f2c; color: #fff; border: none; }
    #result button { background: #fff; color: #c47f2c; border: 2px solid #c47f2c; }
    #confirmStage { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
    #confirmStage h2 {
      position: absolute; left: 0; right: 0; top: 24px;
      margin: 0; padding: 0 16px; pointer-events: none;
    }
    .answer {
      position: absolute; left: 0; top: 0;
      padding: 14px 22px;
      background: #fff; color: #c0392b;
      border: 3px solid #c0392b; border-radius: 999px;
      font-size: 1.2rem; font-weight: 700; white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.3);
      will-change: transform;
    }
    .answer[data-answer="igen"] { color: #3a8a3a; border-color: #3a8a3a; }
    #shotStage { display: none; }
    #result.confirmed #confirmStage { display: none; }
    #result.confirmed #shotStage { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>🎉🥳 Boti és Szonja nap 🎊🎉</h1>
  </header>

  <div id="arena"></div>

  <div id="panel">
    <h3>Kiválasztott napok:</h3>
    <ul id="chosen"></ul>
    <button id="done">Kész</button>
    <div id="status"></div>
  </div>

  <div id="result">
    <div id="confirmStage">
      <h2>Biztosan elküldöd?</h2>
      <div class="answer" data-answer="igen">Igen</div>
      <div class="answer" data-answer="nem">Nem</div>
    </div>
    <div id="shotStage">
      <img id="shot" alt="Kiválasztott napok">
      <div class="actions">
        <a id="download" download="boti-szonja-nap.png">💾 Kép mentése</a>
        <button id="close">Vissza</button>
      </div>
    </div>
  </div>

  <script>
    const DATES = [
      "november 1., vasárnap",
      "november 7., szombat",
      "november 8., vasárnap",
      "november 14., szombat",
      "november 15., vasárnap",
      "november 22., vasárnap",
      "december 5., szombat",
      "december 6., vasárnap",
      "december 12., szombat",
      "december 13., vasárnap",
    ];

    const arena = document.getElementById("arena");
    const chosenEl = document.getElementById("chosen");
    const statusEl = document.getElementById("status");

    const FLEE_RADIUS = 160;      // px: ennyire közel a kurzorhoz már menekül
    const FLEE_FORCE = 14000;     // px/s²
    const BASE_SPEED = 100;       // px/s
    const ASKED_BOOST = 3;        // ennyiszer gyorsabb az első kattintás után

    let pointer = { x: -9999, y: -9999 };
    const startTime = performance.now();

    const items = DATES.map((label, i) => {
      const el = document.createElement("div");
      el.className = "date";
      el.innerHTML = '<span class="box"></span><span></span>';
      el.lastChild.textContent = label;
      arena.appendChild(el);
      const angle = Math.random() * Math.PI * 2;
      return {
        i, label, el,
        x: 0, y: 0,
        vx: Math.cos(angle) * BASE_SPEED,
        vy: Math.sin(angle) * BASE_SPEED,
        w: 0, h: 0,
        checked: false,
        asked: false,     // first click only asks "Biztos?"
        boost: 1,         // speed multiplier, grows after the first click
      };
    });

    function bounds() {
      return { W: arena.clientWidth, H: arena.clientHeight };
    }

    function measure() {
      items.forEach(it => { it.w = it.el.offsetWidth; it.h = it.el.offsetHeight; });
    }

    // Random spot, preferably far away from the pointer.
    function teleport(it) {
      const { W, H } = bounds();
      let best = null, bestD = -1;
      for (let k = 0; k < 8; k++) {
        const x = Math.random() * Math.max(1, W - it.w);
        const y = Math.random() * Math.max(1, H - it.h);
        const d = Math.hypot(x + it.w / 2 - pointer.x, y + it.h / 2 - pointer.y);
        if (d > bestD) { bestD = d; best = { x, y }; }
      }
      it.x = best.x; it.y = best.y;
      const angle = Math.random() * Math.PI * 2;
      const s = currentSpeed() * it.boost * 2;
      it.vx = Math.cos(angle) * s;
      it.vy = Math.sin(angle) * s;
    }

    // Kick the bubble away from the click point; it keeps moving smoothly.
    function pushAway(it, x, y) {
      const dx = it.x + it.w / 2 - x, dy = it.y + it.h / 2 - y;
      const d = Math.hypot(dx, dy) || 1;
      it.vx = (dx / d) * currentSpeed() * it.boost * 3;
      it.vy = (dy / d) * currentSpeed() * it.boost * 3;
    }

    function currentSpeed() {
      // Gets faster over time, up to 2x.
      const t = (performance.now() - startTime) / 1000;
      return BASE_SPEED * Math.min(2, 1 + t / 60);
    }

    function taunt(text, x, y) {
      const t = document.createElement("div");
      t.className = "taunt";
      t.textContent = text;
      t.style.left = Math.min(Math.max(x, 130), arena.clientWidth - 130) + "px";
      t.style.top = y + "px";
      arena.appendChild(t);
      setTimeout(() => t.remove(), 1600);
    }

    items.forEach(it => {
      it.el.addEventListener("pointerdown", e => {
        e.preventDefault();
        const r = arena.getBoundingClientRect();
        const x = e.clientX - r.left, y = e.clientY - r.top;
        if (it.checked) {
          setChecked(it, false);
        } else if (!it.asked) {
          // First click: just ask, and the bubble keeps drifting away unchecked.
          it.asked = true;
          it.boost = ASKED_BOOST;
          taunt(`Biztos jó ${it.label}?`, x, y);
        } else {
          setChecked(it, true);
          taunt("Talált! 🎯", x, y);
        }
        pushAway(it, x, y);
      });
    });

    function setChecked(it, value) {
      it.checked = value;
      it.el.classList.toggle("checked", value);
      renderChosen();
    }

    function renderChosen() {
      chosenEl.innerHTML = "";
      const sel = items.filter(it => it.checked);
      if (!sel.length) {
        chosenEl.innerHTML = '<li class="empty">Még semmi… 😏</li>';
        return;
      }
      sel.forEach(it => {
        const li = document.createElement("li");
        li.textContent = it.label;
        const b = document.createElement("button");
        b.textContent = "×";
        b.title = "Kivesz";
        b.onclick = () => setChecked(it, false);
        li.appendChild(b);
        chosenEl.appendChild(li);
      });
    }

    arena.addEventListener("pointermove", e => {
      const r = arena.getBoundingClientRect();
      pointer.x = e.clientX - r.left;
      pointer.y = e.clientY - r.top;
    });
    arena.addEventListener("pointerleave", () => {
      pointer.x = pointer.y = -9999;
    });
    // On touch screens a tap also scares the nearby dates.
    arena.addEventListener("pointerdown", e => {
      const r = arena.getBoundingClientRect();
      pointer.x = e.clientX - r.left;
      pointer.y = e.clientY - r.top;
    });

    let last = performance.now();
    function step(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const { W, H } = bounds();
      items.forEach(it => {
        const cruise = currentSpeed() * it.boost;
        const maxSpeed = cruise * 4;
        const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
        const dx = cx - pointer.x, dy = cy - pointer.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < FLEE_RADIUS) {
          const f = FLEE_FORCE * (1 - d / FLEE_RADIUS);
          it.vx += (dx / d) * f * dt;
          it.vy += (dy / d) * f * dt;
        }
        // Random wiggle.
        it.vx += (Math.random() - 0.5) * 900 * dt;
        it.vy += (Math.random() - 0.5) * 900 * dt;

        // Relax towards cruise speed, cap at max speed.
        let s = Math.hypot(it.vx, it.vy) || 1;
        const target = s > cruise ? s - (s - cruise) * 1.5 * dt : cruise;
        const clamped = Math.min(maxSpeed, target);
        it.vx *= clamped / s;
        it.vy *= clamped / s;

        it.x += it.vx * dt;
        it.y += it.vy * dt;

        if (it.x < 0) { it.x = 0; it.vx = Math.abs(it.vx); }
        if (it.y < 0) { it.y = 0; it.vy = Math.abs(it.vy); }
        if (it.x > W - it.w) { it.x = Math.max(0, W - it.w); it.vx = -Math.abs(it.vx); }
        if (it.y > H - it.h) { it.y = Math.max(0, H - it.h); it.vy = -Math.abs(it.vy); }

        it.el.style.transform = `translate(${it.x}px, ${it.y}px)`;
      });
      requestAnimationFrame(step);
    }

    measure();
    items.forEach(teleport);
    renderChosen();
    requestAnimationFrame(step);
    window.addEventListener("resize", measure);

    // ---- "Kész": draw the chosen dates into an image ----

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function renderImage(labels) {
      const scale = 2;
      const W = 600, rowH = 56, top = 130;
      const H = top + labels.length * rowH + 40;
      const canvas = document.createElement("canvas");
      canvas.width = W * scale;
      canvas.height = H * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      const font = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';

      ctx.fillStyle = "#fdf6ec";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "#d9a35b";
      ctx.lineWidth = 3;
      ctx.setLineDash([10, 8]);
      roundRect(ctx, 10, 10, W - 20, H - 20, 16);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#2b2118";
      ctx.textAlign = "center";
      ctx.font = `bold 32px ${font}`;
      ctx.fillText("Boti és Szonja nap", W / 2, 62);
      ctx.fillStyle = "#8a7764";
      ctx.font = `italic 18px ${font}`;
      ctx.fillText("(Küldd el a képet Zsombinak Messengeren!)", W / 2, 95);

      ctx.textAlign = "left";
      labels.forEach((label, k) => {
        const y = top + k * rowH;
        ctx.fillStyle = "#e8f6e8";
        ctx.strokeStyle = "#3a8a3a";
        ctx.lineWidth = 2;
        roundRect(ctx, 60, y, W - 120, 42, 21);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#3a8a3a";
        roundRect(ctx, 76, y + 11, 20, 20, 5);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = `bold 15px ${font}`;
        ctx.fillText("✓", 80, y + 27);
        ctx.fillStyle = "#2b2118";
        ctx.font = `20px ${font}`;
        ctx.fillText(label, 110, y + 28);
      });
      return canvas;
    }

    const result = document.getElementById("result");
    document.getElementById("done").addEventListener("click", () => {
      const labels = items.filter(it => it.checked).map(it => it.label);
      if (!labels.length) {
        statusEl.textContent = "Előbb kapjatok el legalább egy dátumot! 😈";
        return;
      }
      statusEl.textContent = "";
      const url = renderImage(labels).toDataURL("image/png");
      document.getElementById("shot").src = url;
      document.getElementById("download").href = url;
      result.classList.remove("confirmed");
      result.classList.add("open");
      startConfirm();
    });
    document.getElementById("close").addEventListener("click", () => result.classList.remove("open"));

    // ---- Last question: "Biztosan elküldöd?" with two fast bubbles ----

    const confirmStage = document.getElementById("confirmStage");
    const CONFIRM_SPEED = BASE_SPEED * 3.5;
    const answers = [...confirmStage.querySelectorAll(".answer")].map(el => (
      { el, yes: el.dataset.answer === "igen", x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0 }
    ));
    const cPointer = { x: -9999, y: -9999 };
    let confirmRunning = false;

    function startConfirm() {
      const W = confirmStage.clientWidth, H = confirmStage.clientHeight;
      answers.forEach((b, k) => {
        b.w = b.el.offsetWidth;
        b.h = b.el.offsetHeight;
        b.x = W * (k ? 0.7 : 0.3) - b.w / 2;
        b.y = (H - b.h) / 2;
        const angle = Math.random() * Math.PI * 2;
        b.vx = Math.cos(angle) * CONFIRM_SPEED;
        b.vy = Math.sin(angle) * CONFIRM_SPEED;
      });
      cPointer.x = cPointer.y = -9999;
      if (!confirmRunning) {
        confirmRunning = true;
        let prev = performance.now();
        requestAnimationFrame(function loop(now) {
          if (!result.classList.contains("open") || result.classList.contains("confirmed")) {
            confirmRunning = false;
            return;
          }
          const dt = Math.min(0.05, (now - prev) / 1000);
          prev = now;
          answers.forEach(b => moveAnswer(b, dt));
          requestAnimationFrame(loop);
        });
      }
    }

    function moveAnswer(b, dt) {
      const W = confirmStage.clientWidth, H = confirmStage.clientHeight;
      const cruise = CONFIRM_SPEED, maxSpeed = cruise * 4;
      const dx = b.x + b.w / 2 - cPointer.x, dy = b.y + b.h / 2 - cPointer.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < FLEE_RADIUS) {
        const f = FLEE_FORCE * (1 - d / FLEE_RADIUS);
        b.vx += (dx / d) * f * dt;
        b.vy += (dy / d) * f * dt;
      }
      b.vx += (Math.random() - 0.5) * 900 * dt;
      b.vy += (Math.random() - 0.5) * 900 * dt;
      const s = Math.hypot(b.vx, b.vy) || 1;
      const target = Math.min(maxSpeed, s > cruise ? s - (s - cruise) * 1.5 * dt : cruise);
      b.vx *= target / s;
      b.vy *= target / s;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx); }
      if (b.y < 0) { b.y = 0; b.vy = Math.abs(b.vy); }
      if (b.x > W - b.w) { b.x = Math.max(0, W - b.w); b.vx = -Math.abs(b.vx); }
      if (b.y > H - b.h) { b.y = Math.max(0, H - b.h); b.vy = -Math.abs(b.vy); }
      b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
    }

    // The overlay is fixed to the viewport, so client coordinates are stage coordinates.
    confirmStage.addEventListener("pointermove", e => { cPointer.x = e.clientX; cPointer.y = e.clientY; });
    confirmStage.addEventListener("pointerdown", e => { cPointer.x = e.clientX; cPointer.y = e.clientY; });
    confirmStage.addEventListener("pointerleave", () => { cPointer.x = cPointer.y = -9999; });
    answers.forEach(b => b.el.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (b.yes) result.classList.add("confirmed");
      else result.classList.remove("open");
    }));
  </script>
</body>
</html>
